name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  firmware:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.1
    steps:
      - uses: actions/checkout@v4
      - name: Build M5 ESP32 firmware
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          python tools/build_board.py m5
      - name: Build Xingzhi ESP32-S3 firmware
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          python tools/build_board.py xingzhi
      - uses: actions/upload-artifact@v4
        with:
          name: fmo-multiboard-firmware
          path: |
            build-m5-regression/m5-fmo-ui-preview.bin
            build-m5-regression/bootloader/bootloader.bin
            build-m5-regression/partition_table/partition-table.bin
            build-xingzhi/m5-fmo-ui-preview.bin
            build-xingzhi/bootloader/bootloader.bin
            build-xingzhi/partition_table/partition-table.bin
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        with:
          repository: espressif/esp-idf
          ref: v5.5.1
          path: .idf-test
          sparse-checkout: components/json
      - run: git -C .idf-test submodule update --init --depth 1 components/json/cJSON
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: pip install -r requirements.txt
      - run: python tools/run_tests.py
        env:
          IDF_PATH: ${{ github.workspace }}/.idf-test
      - name: Build browser flasher
        run: npm --prefix web-flasher ci && npm --prefix web-flasher run build
