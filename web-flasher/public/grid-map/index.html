<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="strict-origin-when-cross-origin"><title>网格地图 · FMO</title><link rel="stylesheet" href="vendor/leaflet.css"><style>body{margin:0;background:#f6f5f1;color:#22313b;font:16px system-ui,sans-serif}header,footer{padding:14px 20px}header h1{font-size:22px;margin:0 0 8px}p{margin:8px 0;color:#596b77}#map{height:60vh;min-height:280px}button,input{font:inherit;border:1px solid #dbe2e6;border-radius:10px;padding:10px 14px;background:white;color:inherit}button{cursor:pointer}button.primary{background:#f4772b;border-color:#f4772b;font-weight:600}button:disabled{opacity:.5;cursor:default}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}#grid{width:110px;text-transform:uppercase}#selection{font-weight:600}#feedback{min-height:24px}.hint{font-size:14px}a{color:#185e85}.cross{font-size:28px;font-weight:bold;color:#e55222;text-shadow:0 0 3px white;text-align:center;line-height:28px}</style></head><body><header><h1>网格地图选点</h1><p>点击地图选择位置，确认后返回设备页面保存。</p><div class="row"><label for="grid">网格地址</label><input id="grid" maxlength="8" placeholder="OM89EV" aria-label="网格地址"><button id="find">定位网格</button><button id="locate">我的位置</button></div></header><main><div id="map" aria-label="点击地图选择位置"></div></main><footer><p id="selection">请先在地图上选点</p><div class="row"><button id="confirm" class="primary" disabled>使用此位置并返回</button><button id="copy" disabled>复制网格地址</button></div><p id="feedback" role="status"></p><p class="hint">使用 WGS84 坐标。底图加载需要互联网；加载失败时仍可输入网格定位。<a href="https://www.openstreetmap.org/fixthemap" target="_blank" rel="noopener">报告地图问题</a></p></footer><script src="vendor/leaflet.js"></script><script src="grid.js"></script><script src="picker.js"></script></body></html>
